name: Bug report
description: Report a reproducible problem in the public repository.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please avoid including credentials, private URLs, customer data, or sensitive vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
